name = "riffrush-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

# Durable Objects com SQLite são os que entram no plano gratuito.
[[durable_objects.bindings]]
name = "DIRETORIO"
class_name = "Diretorio"

[[durable_objects.bindings]]
name = "PRESENCA"
class_name = "Presenca"

[[durable_objects.bindings]]
name = "TRANSMISSOES"
class_name = "Transmissao"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatGlobal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Diretorio"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Presenca", "Transmissao"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChatGlobal"]
