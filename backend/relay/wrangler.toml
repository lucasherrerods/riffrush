name = "riffrush-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Para onde vão as denúncias do chat global (a mesma API do app).
[vars]
URL_DA_API = "https://riffrush-api.onrender.com"

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

# Durable Objects com SQLite são os que entram no plano gratuito.
[[durable_objects.bindings]]
name = "DIRETORIO"
class_name = "Diretorio"

[[durable_objects.bindings]]
name = "PRESENCA"
class_name = "Presenca"

[[durable_objects.bindings]]
name = "TRANSMISSOES"
class_name = "Transmissao"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatGlobal"

# Limite de pedidos por IP, conferido no começo do Worker. O namespace_id é qualquer número único da conta.
[[ratelimits]]
name = "LIMITE_POR_IP"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Diretorio"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Presenca", "Transmissao"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChatGlobal"]
