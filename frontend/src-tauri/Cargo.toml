[package]
name = "riff-rush"
version = "0.1.0"
description = "Riff Rush"
edition = "2024"

[lib]
name = "riff_rush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "io-util", "time"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
socket2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
