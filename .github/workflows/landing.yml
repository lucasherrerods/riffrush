name: Landing

on:
  push:
    branches: [main]
    paths: ["landing/**", "frontend/src/shared/**", "frontend/docs/img/**", ".github/workflows/landing.yml"]
  pull_request:
    paths: ["landing/**", "frontend/src/shared/**", "frontend/docs/img/**", ".github/workflows/landing.yml"]

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

# Os jobs só leem o código: o token do GitHub não precisa de escrita.
permissions:
  contents: read

jobs:
  landing:
    name: Testes e build da landing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
